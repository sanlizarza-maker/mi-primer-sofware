<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Alas del Archipiélago</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:ital,wght@0,600;0,700;1,700&display=swap">
<style>
/* Layout: el mundo 3D ocupa toda la pantalla; el hangar es un panel lateral (abajo en móvil) y el HUD flota en las esquinas. */
:root{
  color-scheme: dark;
  --night:#07182a;
  --panel:rgba(7,24,42,.86);
  --panel-2:rgba(255,255,255,.06);
  --line:rgba(255,255,255,.15);
  --fg:#eef6fb;
  --dim:#a3b9c9;
  --gold:#ffc83d;
  --signal:#ff6a2b;      /* naranja internacional, el de las mangas de viento */
  --signal-ink:#2a0d00;
  --sea:#39d0c8;
  --bad:#ff5d6c;
  --display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --body:"Barlow","Segoe UI",system-ui,sans-serif;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--night);color:var(--fg);font-family:var(--body);font-size:15px;overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* ---------- Hangar / menú ---------- */
#menu{position:fixed;top:0;bottom:0;left:0;width:min(450px,100%);display:flex;flex-direction:column;
  background:var(--panel);border-right:1px solid var(--line);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.m-head{padding-block:18px 12px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:flex;gap:12px;align-items:flex-end;justify-content:space-between}
h1{margin:0;font-family:var(--display);font-style:italic;font-weight:700;font-size:34px;line-height:.92;letter-spacing:.01em;text-transform:uppercase;text-wrap:balance}
h1 small{display:block;font-style:normal;font-weight:600;font-size:13px;letter-spacing:.18em;color:var(--sea);margin-bottom:6px}
.wallet{text-align:right;flex:none}
.wallet span{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.wallet b{font-family:var(--display);font-size:30px;color:var(--gold);line-height:1}
.tabs{display:flex;gap:4px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px 9px;font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--signal)}
#list{flex:1;min-height:0;overflow-y:auto;touch-action:pan-y;padding-block:14px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:10px}
.card{border:1px solid var(--line);background:var(--panel-2);border-radius:4px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.card.sel{border-color:var(--gold)}
.card-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.kind{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--sea)}
.stars{color:var(--gold);letter-spacing:.12em;font-size:14px}
.stars i{font-style:normal;opacity:.25}
.card h3{margin:0;font-family:var(--display);font-weight:700;font-size:23px;line-height:1;text-transform:uppercase;letter-spacing:.02em}
.card p{margin:0;color:var(--dim);line-height:1.35}
.card-foot{display:flex;align-items:center;gap:14px;margin-top:4px}
.pay{font-family:var(--display);font-weight:700;font-size:22px;color:var(--gold)}
.tm{color:var(--dim)}
.go{margin-left:auto;background:var(--signal);color:var(--signal-ink);border:0;border-radius:3px;padding:8px 18px;font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:.06em;text-transform:uppercase}
.go:hover{filter:brightness(1.1)}
.go.alt{background:transparent;color:var(--fg);border:1px solid var(--line)}
.go:disabled{background:transparent;color:var(--dim);border:1px dashed var(--line);cursor:default;filter:none}
.bars{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:center;font-size:12px;color:var(--dim);letter-spacing:.06em;text-transform:uppercase}
.bar{height:5px;background:rgba(255,255,255,.12);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--sea)}
.perk{font-size:13px;color:var(--fg)}
.result{border-radius:4px;padding:12px 14px;border:1px solid var(--gold);background:rgba(255,200,61,.1)}
.result.bad{border-color:var(--bad);background:rgba(255,93,108,.1)}
.result h3{margin:0 0 6px;font-family:var(--display);font-size:24px;text-transform:uppercase;letter-spacing:.03em}
.result dl{margin:0;display:grid;grid-template-columns:1fr auto;gap:2px 12px}
.result dt{color:var(--dim)} .result dd{margin:0;text-align:right}
.result .tot{font-weight:600;color:var(--gold);border-top:1px solid var(--line);padding-top:4px;margin-top:2px}
.m-foot{border-top:1px solid var(--line);padding-block:10px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));font-size:12.5px;color:var(--dim);line-height:1.5}
.m-foot kbd{font:inherit;color:var(--fg);border:1px solid var(--line);border-radius:3px;padding:0 5px}
.opts{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:6px}
.opts button{background:none;border:0;padding:2px 0;color:var(--dim);text-decoration:underline;text-underline-offset:3px}
.opts button:hover{color:var(--fg)}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;font-family:var(--display)}
.h{position:absolute;text-shadow:0 1px 3px rgba(0,20,40,.8)}
#hObj{top:calc(12px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));max-width:46vw}
#hObj b{display:block;font-size:22px;text-transform:uppercase;letter-spacing:.03em;line-height:1}
#hObj span{font-family:var(--body);font-size:14px;color:var(--fg)}
#hTime{top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);font-size:40px;font-weight:700;line-height:1}
#hTime.low{color:var(--bad)}
#hRight{top:calc(12px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;align-items:flex-end;gap:8px}
#hMoney{font-size:26px;font-weight:700;color:var(--gold);line-height:1}
#map{width:124px;height:124px;border-radius:50%;border:2px solid rgba(255,255,255,.55);background:rgba(7,24,42,.55)}
#quit{pointer-events:auto;background:rgba(7,24,42,.6);border:1px solid var(--line);border-radius:3px;padding:5px 12px;font-family:var(--display);font-size:15px;letter-spacing:.08em;text-transform:uppercase}
#hGauge{bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);display:flex;gap:26px;text-align:center}
#hGauge div b{display:block;font-size:30px;line-height:1}
#hGauge div span{font-size:12px;letter-spacing:.16em;color:var(--fg);opacity:.8}
#hMsg{top:24%;left:50%;transform:translateX(-50%);font-size:34px;font-weight:700;font-style:italic;text-transform:uppercase;text-align:center;white-space:nowrap;transition:opacity .3s}
#ptr{position:absolute;left:0;top:0;width:0;height:0;will-change:transform}
#ptr i{position:absolute;left:-13px;top:-13px;width:26px;height:26px;border:3px solid var(--gold);border-radius:50%;box-sizing:border-box}
#ptr.off i{border:0;border-radius:0;left:-12px;top:-14px;width:0;height:0;border-left:12px solid transparent;border-right:12px solid transparent;border-bottom:26px solid var(--gold)}
#ptr span{position:absolute;top:18px;left:-40px;width:80px;text-align:center;font-size:15px;color:var(--gold);text-shadow:0 1px 3px rgba(0,0,0,.9)}
/* controles táctiles */
#stick,.tbtn{display:none;pointer-events:auto;position:absolute}
.touch #stick{display:block;left:max(22px,env(safe-area-inset-left,0px));bottom:calc(24px + env(safe-area-inset-bottom,0px));width:128px;height:128px;border-radius:50%;border:2px solid rgba(255,255,255,.45);background:rgba(7,24,42,.35)}
#knob{position:absolute;left:39px;top:39px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.75)}
.touch .tbtn{display:block;right:max(22px,env(safe-area-inset-right,0px));width:84px;height:60px;border-radius:6px;border:2px solid rgba(255,255,255,.45);background:rgba(7,24,42,.4);font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.08em;text-transform:uppercase}
#bBoost{bottom:calc(96px + env(safe-area-inset-bottom,0px));border-color:var(--signal)!important}
#bBrake{bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.touch #hGauge{bottom:calc(8px + env(safe-area-inset-bottom,0px))}
#err{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center;background:var(--night);font-size:17px;line-height:1.5}

@media (max-width:760px){
  #menu{top:auto;width:100%;height:64%;border-right:0;border-top:1px solid var(--line);padding-top:0}
  .m-head{padding-block:12px 8px} h1{font-size:26px} .wallet b{font-size:25px}
  .m-foot .keys{display:none}
  #hMsg{font-size:24px} #hTime{font-size:32px} #map{width:92px;height:92px}
  #hObj b{font-size:18px}
  #hTime{left:max(16px,env(safe-area-inset-left,0px));transform:none}
  #hObj{top:calc(46px + env(safe-area-inset-top,0px));max-width:58vw}
}
@media (prefers-reduced-motion:reduce){#hMsg{transition:none}}
</style>

<canvas id="c" aria-label="Vista 3D del juego"></canvas>

<div id="hud" hidden>
  <div class="h" id="hObj"><b id="oName"></b><span id="oText"></span></div>
  <div class="h num" id="hTime"></div>
  <div class="h" id="hRight">
    <div class="num" id="hMoney"></div>
    <canvas id="map" width="248" height="248"></canvas>
    <button id="quit" type="button">Salir · Esc</button>
  </div>
  <div class="h" id="hMsg"></div>
  <div id="ptr"><i></i><span class="num"></span></div>
  <div class="h num" id="hGauge">
    <div><b id="gSpd">0</b><span>KM/H</span></div>
    <div><b id="gAlt">0</b><span>ALTITUD M</span></div>
  </div>
  <div id="stick"><div id="knob"></div></div>
  <button class="tbtn" id="bBoost" type="button">Turbo</button>
  <button class="tbtn" id="bBrake" type="button">Freno</button>
</div>

<section id="menu" aria-label="Hangar">
  <header class="m-head">
    <h1><small>8 ISLAS · 6 AVIONES</small>Alas del Archipiélago</h1>
    <div class="wallet"><span>Tu dinero</span><b class="num" id="money">$0</b></div>
  </header>
  <nav class="tabs" role="tablist">
    <button type="button" role="tab" id="tabM" aria-selected="true">Misiones</button>
    <button type="button" role="tab" id="tabH" aria-selected="false">Hangar</button>
  </nav>
  <div id="list"></div>
  <footer class="m-foot">
    <div class="keys"><kbd>←</kbd><kbd>→</kbd> girar · <kbd>↑</kbd><kbd>↓</kbd> subir y bajar · <kbd>Espacio</kbd> acelerar y turbo · <kbd>X</kbd> freno</div>
    <div class="opts">
      <button type="button" id="oInv"></button>
      <button type="button" id="oSnd"></button>
      <button type="button" id="oGfx"></button>
      <button type="button" id="oReset">Borrar partida</button>
    </div>
  </footer>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
if(!window.THREE){document.body.insertAdjacentHTML('beforeend','<div id="err">No se pudo cargar el motor 3D. Revisa tu conexión y recarga la página.</div>');return;}
const T=THREE, PI=Math.PI;
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t, rnd=(a,b)=>a+Math.random()*(b-a);
const sstep=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
const fmt=n=>'$'+Math.round(n).toLocaleString('es');

/* ================= Partida guardada ================= */
const KEY='alas-archipielago-v1';
let save={money:0,owned:['gorrion'],sel:'gorrion',done:0,visited:[],inv:false,snd:true,gfx:true};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null'); if(s&&Array.isArray(s.owned)) save=Object.assign(save,s);}catch(e){}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(save));}catch(e){}}

/* ================= Aviones ================= */
const PLANES=[
 {id:'gorrion',name:'Gorrión',tag:'Entrenador de hélice',price:0,cruise:70,max:95,min:38,turn:1.0,acc:16,perk:'Noble y fácil. Perfecto para empezar.',
  b:{len:8.5,rad:.85,span:11.5,rc:2,tc:1.5,sw:.1,high:1,eng:'prop',gear:1,body:0xffc933,wing:0xffc933,acc:0x1f4e8c}},
 {id:'pelicano',name:'Pelícano',tag:'Hidroavión',price:1500,cruise:82,max:112,min:40,turn:.95,acc:18,floats:true,perk:'Sus flotadores tocan el mar sin estrellarse. Ideal para apagar incendios.',
  b:{len:9.5,rad:1,span:13.5,rc:2.2,tc:1.6,sw:.15,high:1,eng:'prop',floats:1,body:0xf5f7fa,wing:0xf5f7fa,acc:0xe63946}},
 {id:'halcon',name:'Halcón',tag:'Avión de carreras',price:4000,cruise:108,max:152,min:50,turn:1.35,acc:30,perk:'Gira como ninguno. Hecho para los aros.',
  b:{len:9,rad:.8,span:9.5,rc:2.3,tc:1,sw:.5,eng:'prop',body:0xd7263d,wing:0xd7263d,acc:0xffffff}},
 {id:'albatros',name:'Albatros',tag:'Bimotor de carga',price:9000,cruise:122,max:172,min:58,turn:1.0,acc:26,bonus:.25,perk:'Bodega grande: cobras 25 % más en cada misión.',
  b:{len:13,rad:1.15,span:17,rc:2.8,tc:1.5,sw:.6,eng:'twin',body:0xcfd8dc,wing:0xcfd8dc,acc:0x0b7a75}},
 {id:'centella',name:'Centella',tag:'Jet ligero',price:18000,cruise:152,max:222,min:70,turn:1.25,acc:42,perk:'Tu primer jet. Llega a todas partes antes que nadie.',
  b:{len:12,rad:.9,span:10.5,rc:3.2,tc:1.2,sw:2.6,eng:'jet',body:0x1d7fd6,wing:0x1d7fd6,acc:0xffd400}},
 {id:'tormenta',name:'Tormenta',tag:'Caza de ala delta',price:40000,cruise:182,max:285,min:80,turn:1.5,acc:60,perk:'El más rápido del archipiélago. Y el más difícil de domar.',
  b:{len:14,rad:.95,span:10,rc:7.5,tc:.8,sw:6.2,eng:'jet',delta:1,body:0x2b2f3a,wing:0x2b2f3a,acc:0xff5a1f}},
];
const planeById=id=>PLANES.find(p=>p.id===id)||PLANES[0];

/* ================= Escena ================= */
const canvas=$('c');
let renderer;
try{renderer=new T.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});}
catch(e){document.body.insertAdjacentHTML('beforeend','<div id="err">Tu navegador no pudo iniciar los gráficos 3D (WebGL). Prueba con otro navegador o dispositivo.</div>');return;}
renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;
const MAXA=renderer.capabilities.getMaxAnisotropy();
const scene=new T.Scene();
const FOGC=new T.Color(0xc9e2f2), FOGN=2500, FOGF=11500;
scene.fog=new T.Fog(FOGC,FOGN,FOGF);
const cam=new T.PerspectiveCamera(62,1,1.5,32000);
const SUN=new T.Vector3(.5,.55,-.67).normalize();
scene.add(new T.HemisphereLight(0xcfe6ff,0x5d6b48,.78));
const sunL=new T.DirectionalLight(0xfff0d0,.95); sunL.position.copy(SUN); scene.add(sunL,sunL.target);
{const c=sunL.shadow.camera;c.left=c.bottom=-240;c.right=c.top=240;c.near=10;c.far=3600;sunL.shadow.mapSize.set(2048,2048);sunL.shadow.bias=-.0004;sunL.shadow.normalBias=1.6;}
function applyGfx(){sunL.castShadow=!!save.gfx;renderer.setPixelRatio(save.gfx?Math.min(window.devicePixelRatio||1,2):1);renderer.setSize(innerWidth,innerHeight,false);}

// Cielo
const sky=new T.Mesh(new T.SphereGeometry(16000,24,16),new T.ShaderMaterial({side:T.BackSide,depthWrite:false,fog:false,
  uniforms:{sunDir:{value:SUN},fogC:{value:FOGC}},
  vertexShader:'varying vec3 vD;void main(){vD=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader:`uniform vec3 sunDir;uniform vec3 fogC;varying vec3 vD;
  void main(){vec3 d=normalize(vD);float h=d.y;
    vec3 c=mix(fogC,vec3(.42,.70,.95),smoothstep(0.,.2,h));c=mix(c,vec3(.05,.3,.5),smoothstep(0.,-.2,h));c=mix(c,vec3(.09,.36,.78),smoothstep(.15,.8,h));
    float s=max(dot(d,sunDir),0.);c+=vec3(1.,.9,.7)*pow(s,400.)*1.6+vec3(1.,.8,.55)*pow(s,10.)*.22;
    gl_FragColor=vec4(c,1.);
    #include <encodings_fragment>
    }`}));
{const pm=new T.PMREMGenerator(renderer),es=new T.Scene();es.add(sky);scene.environment=pm.fromScene(es,0,1,20000).texture;pm.dispose();}
scene.add(sky);
// utilidades de geometría: colorear y fusionar
function colored(g,hex){g=g.index?g.toNonIndexed():g;const c=new T.Color(hex),n=g.attributes.position.count,a=new Float32Array(n*3);for(let i=0;i<n;i++){a[i*3]=c.r;a[i*3+1]=c.g;a[i*3+2]=c.b;}g.setAttribute('color',new T.BufferAttribute(a,3));return g;}
function merge(list){let n=0;for(const g of list)n+=g.attributes.position.count;const P_=new Float32Array(n*3),N_=new Float32Array(n*3),C_=new Float32Array(n*3);let o=0;
  for(const g of list){g.computeVertexNormals();P_.set(g.attributes.position.array,o);N_.set(g.attributes.normal.array,o);C_.set(g.attributes.color.array,o);o+=g.attributes.position.count*3;}
  const m=new T.BufferGeometry();m.setAttribute('position',new T.BufferAttribute(P_,3));m.setAttribute('normal',new T.BufferAttribute(N_,3));m.setAttribute('color',new T.BufferAttribute(C_,3));return m;}

/* ---------- Ruido y terreno ---------- */
function hash(x,y){const n=Math.sin(x*127.1+y*311.7)*43758.5453;return n-Math.floor(n);}
function vnoise(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  const a=hash(xi,yi),b=hash(xi+1,yi),c=hash(xi,yi+1),d=hash(xi+1,yi+1);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;}
function fbm(x,y){let s=0,a=.5,f=1;for(let i=0;i<4;i++){s+=a*vnoise(x*f,y*f);f*=2;a*=.5;}return s/.9375;}

const ISL=[
 {n:'Isla Tortuga',x:0,z:0,r:720,h:170,t:'n',s:11,village:1,light:1},
 {n:'Volcán Rojo',x:2700,z:-1900,r:950,h:440,t:'v',s:23},
 {n:'Cayo Palmera',x:-2300,z:-1000,r:460,h:45,t:'n',s:37,palm:1,village:1},
 {n:'Sierra Nublada',x:-1500,z:2900,r:1050,h:400,t:'n',s:41,snow:1,village:1},
 {n:'Gemela Mayor',x:2300,z:2100,r:560,h:210,t:'n',s:53,village:1},
 {n:'Gemela Menor',x:3250,z:2750,r:440,h:170,t:'n',s:59,palm:1},
 {n:'Roca del Faro',x:350,z:-3500,r:360,h:150,t:'n',s:67,rock:1,light:1},
 {n:'Atolón Coral',x:-3900,z:900,r:620,h:30,t:'a',s:71,palm:1},
];
// Pistas de aterrizaje: una por isla, en la costa y paralela a ella
for(const I of ISL){const a=I.s*1.3+2.2,d=(I.t==='a'?.68:.74)*I.r,x=I.x+Math.cos(a)*d,z=I.z+Math.sin(a)*d;
  I.strip={x,z,a,ux:-Math.sin(a),uz:Math.cos(a),hl:Math.min(340,I.r*.8)/2,hw:15,y:8,name:I.n,p:new T.Vector3(x,8,z)};}
function inStrip(s,x,z,m){const dx=x-s.x,dz=z-s.z;return Math.abs(dx*s.ux+dz*s.uz)<=s.hl+m&&Math.abs(-dx*s.uz+dz*s.ux)<=s.hw+m;}
function stripAt(x,z,m){for(const I of ISL)if(inStrip(I.strip,x,z,m))return I.strip;return null;}
function nearestStrip(x,z){let b=null,bd=1e18;for(const I of ISL){const s=I.strip,d=(s.x-x)*(s.x-x)+(s.z-z)*(s.z-z);if(d<bd){bd=d;b=s;}}b.d2=bd;return b;}
function islandH(I,x,z){
  const dx=x-I.x,dz=z-I.z;let d=Math.sqrt(dx*dx+dz*dz)/I.r;if(d>1.25)return -6;
  d+=(vnoise(x*.0035+I.s,z*.0035-I.s)-.5)*.32;
  const n=fbm(x*.006+I.s*3.1,z*.006+I.s*1.7);let h;
  if(I.t==='a'){const g=(d-.68)/.14;h=I.h*Math.exp(-g*g)*(.5+n)-4;}
  else if(I.t==='v'){const c=Math.max(0,1-d);h=I.h*Math.pow(c,1.15)*(.85+.3*n)*1.15-5;const cr=Math.max(0,1-d/.13);h-=I.h*.3*cr*cr*(3-2*cr);}
  else{const f=clamp(1-d,0,1),s=f*f*(3-2*f);h=I.h*Math.pow(s,1.25)*(.35+1.3*n)-5;}
  const s=I.strip,sx=x-s.x,sz=z-s.z,o=Math.max(Math.abs(sx*s.ux+sz*s.uz)-s.hl-25,Math.abs(-sx*s.uz+sz*s.ux)-s.hw-34);
  if(o<70)h=lerp(s.y,h,sstep(0,70,o));
  // corredor despejado para despegar y aproximarse por los dos extremos
  const ab=Math.max(0,Math.abs(sx*s.ux+sz*s.uz)-s.hl-25);if(ab<600){const cap=s.y+ab*.05,w=Math.max(sstep(0,90,Math.abs(-sx*s.uz+sz*s.ux)-s.hw-55),sstep(430,600,ab));h=Math.min(h,lerp(cap,h,w));}
  return Math.max(h,-6);
}
function terrainH(x,z){let m=-6;for(const I of ISL){const dx=x-I.x,dz=z-I.z,R=I.r*1.25;if(dx*dx+dz*dz<R*R){const h=islandH(I,x,z);if(h>m)m=h;}}return m;}

  if(jet){const nr=pr(1)*R*SH.sy,ny=fy(1);
    add(new T.CylinderGeometry(nr*.8,nr*1.03,1.1,18,1,true).rotateX(PI/2),mDark,0,ny,L/2+.45);

    for(const sx of[-1,1]){const il=L*.3,ix_=sx*R*SH.sx*.98,iy_=-R*.12,iz=zt(b.delta?.5:.45);

const REF=[62,100,150],PAY=[450,1300,3400],BONUS=[6,14,30],HINT=['Sirve cualquier avión.','Mejor con un Halcón o superior.','Necesitas un jet para llegar a tiempo.'];
const KIND={ring:'Carrera de aros',mail:'Correo aéreo',balloon:'Caza de globos',fire:'Bombero del aire'};
const yawTo=(dx,dz)=>Math.atan2(-dx,-dz);
function genMission(type,stars){
  const s=stars-1,tg=[];let name,desc,ordered=true,slack,home;
  const pick=f=>{const l=ISL.filter(f||(()=>1));return l[Math.floor(Math.random()*l.length)];};
  if(type==='ring'){
    const n=[8,11,14][s];
    if(Math.random()<.55){const I=pick(),dir=Math.random()<.5?1:-1,a0=I.strip.a+dir*.55,ph=rnd(0,6);home=I;
      for(let i=0;i<n;i++){const a=a0+dir*i*(PI*1.7/n),rr=I.r*(1+.22*Math.sin(i*1.7+ph)),x=I.x+Math.cos(a)*rr,z=I.z+Math.sin(a)*rr;
        tg.push({kind:'ring',r:30,p:new T.Vector3(x,Math.max(terrainH(x,z)+60,75+55*(Math.sin(i*1.3+ph)+1)),z)});}
      name='Vuelta a '+I.n;desc='Cruza '+n+' aros en orden rodeando la isla.';}
    else{const A=pick();let B;do{B=pick();}while(B===A);home=A;const dx=B.x-A.x,dz=B.z-A.z,L=Math.hypot(dx,dz),ux=dx/L,uz=dz/L,ph=rnd(0,6);
      for(let i=0;i<n;i++){const t=(i+.5)/n,lat=(i%2?1:-1)*(110+s*30),x=A.x+dx*t-uz*lat,z=A.z+dz*t+ux*lat;
        tg.push({kind:'ring',r:30,p:new T.Vector3(x,Math.max(terrainH(x,z)+60,90+60*(Math.sin(i*.9+ph)+1)),z)});}
      name='Eslalon '+A.n.split(' ').pop()+' – '+B.n.split(' ').pop();desc='Zigzaguea por '+n+' aros de '+A.n+' a '+B.n+'.';}
    for(let i=0;i<tg.length;i++){const a=tg[Math.max(0,i-1)].p,b=tg[Math.min(tg.length-1,i+1)].p;tg[i].dir=b.clone().sub(a).normalize();}
    slack=1.32;
  }else if(type==='mail'){
    const n=[2,3,5][s],sh=ISL.slice().sort(()=>Math.random()-.5),list=sh.slice(0,n);home=sh[n];
    for(const I of list)tg.push({kind:'mail',r:55,p:I.port.clone(),label:I.n});
    ordered=false;name='Correo para '+n+' islas';desc='Pasa por el haz de luz de cada isla, en el orden que quieras: '+list.map(i=>i.n).join(', ')+'.';slack=1.25;
  }else if(type==='balloon'){
    const n=[8,12,16][s],I=pick(i=>i.t!=='v');home=I;
    for(let i=0;i<n;i++){const a=rnd(0,6.28),d=I.r*rnd(.35,1.05),x=I.x+Math.cos(a)*d,z=I.z+Math.sin(a)*d;tg.push({kind:'balloon',r:17,p:new T.Vector3(x,Math.max(terrainH(x,z),0)+rnd(45,120),z)});}
    ordered=false;name='Globos sobre '+I.n;desc='Revienta '+n+' globos volando contra ellos. Frena para girar más cerrado.';slack=1.75;
  }else{
    const n=[2,3,4][s],I=pick(i=>i.t==='n'&&!i.palm&&!i.rock),a0=rnd(0,6.28);home=I;
    for(let i=0;i<n;i++){const a=a0+i*(6.28/n)+rnd(-.3,.3);let d=.5,x,z,h;for(let k=0;k<12;k++){x=I.x+Math.cos(a)*I.r*d;z=I.z+Math.sin(a)*I.r*d;h=terrainH(x,z);if(h>12)break;d-=.04;}
      tg.push({kind:'water',r:42,p:new T.Vector3(I.x+Math.cos(a)*I.r*1.3,3,I.z+Math.sin(a)*I.r*1.3)});
      tg.push({kind:'fire',r:48,p:new T.Vector3(x,h+4,z)});}
    name='Incendio en '+I.n;desc='Carga agua volando a ras del mar sobre el círculo azul y suéltala sobre cada uno de los '+n+' fuegos.';slack=1.5;
  }
  const start={strip:home.strip,pos:home.strip.p};
  if(!ordered){const rest=tg.slice(),out=[];let c=start.pos;while(rest.length){let bi=0,bd=1e9;rest.forEach((t,i)=>{const d=t.p.distanceTo(c);if(d<bd){bd=d;bi=i;}});c=rest[bi].p;out.push(rest.splice(bi,1)[0]);}tg.length=0;tg.push(...out);}
  let len=0,c=start.pos;for(const t of tg){len+=t.p.distanceTo(c);c=t.p;}
  const time=Math.ceil((len/REF[s]*slack+tg.length*2.5+22)/5)*5;
  start.sign=(tg[0].p.x-home.strip.x)*home.strip.ux+(tg[0].p.z-home.strip.z)*home.strip.uz>=0?1:-1;
  desc+=' Despegas de '+home.n+' y cobras al aterrizar en cualquier pista.';
  return{type,stars,name,desc,ordered,targets:tg,start,time,reward:Math.round(PAY[s]*rnd(.88,1.15)/10)*10};
}

  scene.add(g);t.mesh=g;}
function clearTarget(t){if(t.mesh){scene.remove(t.mesh);t.mesh.traverse(o=>{if(o.material)o.material.dispose();});t.mesh=null;}}
function hitTest(t,p){const dx=p.x-t.p.x,dy=p.y-t.p.y,dz=p.z-t.p.z,h2=dx*dx+dz*dz,r2=t.r*t.r;
  switch(t.kind){case'ring':case'balloon':return h2+dy*dy<r2;case'mail':return h2<r2&&Math.abs(dy)<170;case'fire':return h2<r2&&dy>-10&&dy<170;default:return h2<r2&&p.y<34;}}

/* ================= Estado de vuelo ================= */
const P={pos:new T.Vector3(),yaw:0,pitch:0,roll:0,speed:0,boost:0,ground:true,touch:false,hint:false};
const HOME=ISL[0].strip;
let state='menu',mission=null,result=null,tab='mis',previewId=save.sel,endT=0,time=0,msgT=0,edge=false,trailT=0,smokeT=0;
const keys={},stick={x:0,y:0},tb={boost:false,brake:false};
const fwd=new T.Vector3(),tmp=new T.Vector3(),camT=new T.Vector3();
function getFwd(o){const cp=Math.cos(P.pitch);return o.set(-Math.sin(P.yaw)*cp,Math.sin(P.pitch),-Math.cos(P.yaw)*cp);}
const gearH=()=>planeSpec.b.rad+(planeSpec.b.floats?2.2:1.5);
function park(s,sign){P.pos.set(s.x-s.ux*sign*(s.hl-22),s.y+gearH(),s.z-s.uz*sign*(s.hl-22));P.yaw=yawTo(s.ux*sign,s.uz*sign);P.pitch=P.roll=P.speed=P.boost=0;P.ground=true;P.touch=P.hint=false;}
function msg(text,sec){const e=$('hMsg');e.textContent=text;e.style.opacity=1;msgT=sec||2;}

function startFlight(m){
  audioInit();if(AC&&AC.state==='suspended')AC.resume();
  setPlane(save.sel);previewId=save.sel;mission=null;result=null;
  if(m){mission={def:m,targets:m.targets.map(t=>Object.assign({},t,{done:false})),idx:0,left:m.targets.length,tLeft:m.time,carry:false};
    mission.targets.forEach(makeTargetMesh);park(m.start.strip,m.start.sign);}
  else park(HOME,1);
  edge=false;getFwd(fwd);cam.position.copy(P.pos).addScaledVector(fwd,-30).y+=8;
  state='fly';$('menu').hidden=true;$('hud').hidden=false;$('hTime').hidden=!m;
  msg(document.body.classList.contains('touch')?'Mantén TURBO y luego sube':'Mantén ESPACIO y luego sube',4);updObjective();
}
function finish(ok,reason){
  const m=mission.def;let res;
  if(ok){const tb_=Math.round(mission.tLeft*BONUS[m.stars-1]/10)*10,cg=planeSpec.bonus?Math.round((m.reward+tb_)*planeSpec.bonus/10)*10:0,tot=m.reward+tb_+cg;
    save.money+=tot;save.done++;res={ok:true,name:m.name,base:m.reward,time:tb_,cargo:cg,total:tot};offers=offers.filter(o=>o!==m);if(offers.length<4)refill();
    beep(660,1320,.5,.14);state='win';endT=2.2;msg('¡Misión cumplida!  +'+fmt(tot),2.2);}
  else{const fee=reason==='crash'?Math.min(save.money,100*m.stars):0;save.money-=fee;res={ok:false,name:m.name,reason,fee};
    if(reason==='crash'){state='crash';endT=1.7;}else{state='win';endT=1.6;msg('Se acabó el tiempo',1.6);beep(300,120,.6,.12,'sawtooth');}}
  result=res;persist();
}
function refill(){const have=offers.map(o=>o.type),types=['ring','mail','balloon','fire'].filter(t=>!have.includes(t));const t=types[0]||'ring';
  const st=save.done<2?1:Math.random()<.4?1:Math.random()<.6?2:3;offers.push(genMission(t,st));offers.sort((a,b)=>a.stars-b.stars);}
function crash(tip){
  burst(P.pos,0xff8a2b,22,45,5);burst(P.pos,0xfff0a0,10,25,4);for(let i=0;i<8;i++)spawnP(P.pos.x,P.pos.y,P.pos.z,rnd(-12,12),rnd(8,25),rnd(-12,12),0x333333,6,rnd(1,1.8),14,false);
  planeObj.visible=false;beep(180,40,.8,.25,'sawtooth');
  if(mission&&state==='fly'){finish(false,'crash');result.tip=tip;}else if(mission){state='crash';endT=1.6;}else{state='crash';endT=1.6;result={ok:false,name:'Vuelo libre',reason:'crash',fee:0};if(tip)msg(tip,1.6);}
}
function toMenu(){
  if(mission){mission.targets.forEach(clearTarget);mission=null;}
  state='menu';planeObj.visible=true;park(HOME,1);engSet(false,0,false);
  $('menu').hidden=false;$('hud').hidden=true;tab='mis';renderMenu();
}
function updObjective(){
  const n=$('oName'),t=$('oText');
  if(!mission){n.textContent='Vuelo libre';t.textContent='Estrella dorada: $50 · Primera vez que aterrizas en una isla: $150';return;}
  const tot=mission.targets.length,done=tot-mission.left;n.textContent=mission.def.name;
  if(mission.landing){t.textContent='Aterriza en una pista para cobrar: despacio, nivelado y alineado. Frena al tocar.';return;}
  const cur=currentTarget();
  if(!cur){t.textContent='';return;}
  t.textContent=cur.kind==='ring'?'Aro '+(done+1)+' de '+tot:cur.kind==='mail'?'Entregas '+done+' de '+tot+' · siguiente: '+cur.label:cur.kind==='balloon'?'Globos '+done+' de '+tot:
    cur.kind==='water'?'Carga agua: vuela a ras del mar por el círculo azul':'Suelta el agua sobre el fuego ('+(done>>1)+' de '+(tot>>1)+' apagados)';
}
const navT={p:null,kind:'strip'};
function currentTarget(){
  if(mission&&mission.landing){navT.p=nearestStrip(P.pos.x,P.pos.z).p;return navT;}
  if(!mission||!mission.left)return null;
  if(mission.def.ordered)return mission.targets[mission.idx];
  let b=null,bd=1e12;for(const t of mission.targets)if(!t.done){const d=t.p.distanceToSquared(P.pos);if(d<bd){bd=d;b=t;}}return b;
}

function landed(s){
  let nw=false;if(!save.visited.includes(s.name)){save.visited.push(s.name);save.money+=150;persist();nw=true;}
  if(mission&&mission.landing&&state==='fly')finish(true);
  else{msg(nw?'Pista nueva: '+s.name+'  +$150':'Aterrizaste en '+s.name,2.6);if(nw)beep(660,990,.3,.12);}
}
function liftoff(){P.ground=false;P.touch=false;P.hint=false;P.pitch=.14;P.pos.y+=.3;}
function updateFlight(dt,ctrl){
  const S=planeSpec,gh=gearH();let ix=0,iy=0,boost=false,brake=false;
  if(ctrl){ix=(keys.ArrowRight||keys.KeyD?1:0)-(keys.ArrowLeft||keys.KeyA?1:0)+stick.x;iy=(keys.ArrowUp||keys.KeyW?1:0)-(keys.ArrowDown||keys.KeyS?1:0)-stick.y;
    if(save.inv)iy=-iy;ix=clamp(ix,-1,1);iy=clamp(iy,-1,1);boost=keys.Space||keys.ShiftLeft||keys.ShiftRight||tb.boost;brake=keys.KeyX||keys.KeyC||tb.brake;}
  if(P.ground){
    // rodaje por la pista
    const Vr=S.min*.85,st=stripAt(P.pos.x,P.pos.z,6),k=Math.min(1,dt*8);
    P.roll-=P.roll*k;P.pitch-=P.pitch*k;P.boost-=P.boost*Math.min(1,dt*4);P.yaw-=ix*.75*dt;
    if(boost)P.speed=Math.min(S.cruise,P.speed+S.acc*1.2*dt);else P.speed=Math.max(0,P.speed-(brake||!ctrl?75:P.touch?26:10)*dt);
    if(!st){if(P.speed>=Vr)liftoff();else if(P.speed>24){crash('Te saliste de la pista.');return;}else P.speed=Math.min(P.speed,9);}
    P.pos.x-=Math.sin(P.yaw)*P.speed*dt;P.pos.z-=Math.cos(P.yaw)*P.speed*dt;
    if(P.ground){const th=terrainH(P.pos.x,P.pos.z);if(th<.5){crash('Te caíste al mar.');return;}P.pos.y=th+gh;
      if(P.speed>=Vr){if(iy>.2)liftoff();else if(!P.hint&&!P.touch){P.hint=true;msg('¡Ya puedes subir!',1.6);}}
      if(P.touch&&P.speed<3&&st){P.touch=false;landed(st);}}
    getFwd(fwd);
  }else{
    // límite del mundo
    const far=Math.hypot(P.pos.x,P.pos.z);
    if(far>7200){const want=yawTo(-P.pos.x,-P.pos.z);let d=want-P.yaw;d=Math.atan2(Math.sin(d),Math.cos(d));ix=clamp(-d*2,-1,1);if(!edge){edge=true;msg('Fin del mapa: dando la vuelta',2.5);}}else if(far<6800)edge=false;
    if(P.pos.y>1350&&iy>-.3)iy=-.4;
    const slow=brake?1.25:1;
    P.roll+=(-ix*1.08-P.roll)*Math.min(1,dt*3.4*S.turn);
    P.yaw+=P.roll*.82*S.turn*slow*dt;
    P.pitch+=(iy*.72-P.pitch)*Math.min(1,dt*2.6);
    let tgt=boost?S.max:brake?S.min:S.cruise;tgt-=Math.sin(P.pitch)*18;
    P.speed+=clamp(tgt-P.speed,-S.acc*1.6*dt,S.acc*dt);
    P.boost+=((boost?1:0)-P.boost)*Math.min(1,dt*4);
    getFwd(fwd);P.pos.addScaledVector(fwd,P.speed*dt);
    // mar y tierra
    if(P.pos.y<1.6){if(S.floats){P.pos.y=1.6;if(P.pitch<.04)P.pitch=.04;if(Math.random()<.5)spawnP(P.pos.x,.5,P.pos.z,rnd(-6,6),rnd(4,10),rnd(-6,6),0xffffff,2,.5,5,false);}else{crash();return;}}
    const th=terrainH(P.pos.x,P.pos.z);
    if(P.pos.y<th+gh){const st=stripAt(P.pos.x,P.pos.z,4);
      if(!st){crash();return;}
      const al=Math.abs(-Math.sin(P.yaw)*st.ux-Math.cos(P.yaw)*st.uz);
      if(P.pitch<-.24){crash('Llegaste en picada. Baja más suave.');return;}
      if(Math.abs(P.roll)>.5){crash('Tocaste pista con las alas inclinadas.');return;}
      if(P.speed>S.cruise*1.25){crash('Demasiado rápido para aterrizar. Usa el freno.');return;}
      if(al<.7){crash('Hay que entrar alineado con la pista.');return;}
      P.ground=true;P.touch=true;P.hint=false;P.pos.y=th+gh;beep(140,90,.15,.12,'square');
      for(let i=0;i<6;i++)spawnP(P.pos.x,th+.5,P.pos.z,rnd(-4,4),rnd(1,3),rnd(-4,4),0xdddddd,.6,.45,1.6,false);}
  }
  // estela con turbo
  trailT-=dt;if(P.boost>.5&&trailT<=0){trailT=.03;const L=planeObj.userData.len/2;spawnP(P.pos.x-fwd.x*L,P.pos.y-fwd.y*L,P.pos.z-fwd.z*L,0,0,0,0xffffff,1.2,.7,3,false);}
  // monedas
  for(const c of coins)if(c.cd<=0&&c.m.position.distanceToSquared(P.pos)<24*24){c.cd=70;c.m.visible=false;save.money+=50;persist();burst(c.m.position,0xffc83d,10,30,3);beep(990,1480,.18,.1);msg('+$50',.9);}
  // objetivos
  if(mission&&state==='fly'&&!mission.landing){
    mission.tLeft-=dt;
    const list=mission.def.ordered?[mission.targets[mission.idx]]:mission.targets;
    for(const t of list){if(!t||t.done||!hitTest(t,P.pos))continue;
      t.done=true;mission.left--;mission.idx++;
      const col=t.kind==='water'?0x5fe8ff:t.kind==='fire'?0xffffff:0xffc83d;burst(t.kind==='ring'||t.kind==='balloon'?t.p:P.pos,col,14,40,3.5);
      if(t.kind==='water'){msg('¡Agua cargada!',1.2);beep(500,900,.2,.1);}else if(t.kind==='fire'){msg('¡Fuego apagado!',1.2);beep(700,1100,.25,.1);for(let i=0;i<10;i++)spawnP(P.pos.x,P.pos.y,P.pos.z,rnd(-10,10),rnd(-45,-25),rnd(-10,10),0x7fdcff,3,.9,4,false);}
      else beep(780,1180,.16,.1);
      clearTarget(t);updObjective();}
    if(!mission.left){mission.landing=true;msg('¡Listo! Ahora aterriza para cobrar',3.2);beep(660,1100,.35,.12);updObjective();}
    else if(mission.tLeft<=0)finish(false,'time');
  }
}
function updateCam(dt,snap){
  const d=planeObj.userData.len*1.9+7;getFwd(fwd);
  camT.copy(P.pos).addScaledVector(fwd,-d);camT.y+=4.5+d*.12-P.pitch*3;
  const k=snap?1:1-Math.exp(-dt*5.5);cam.position.lerp(camT,k);
  const fl=Math.max(terrainH(cam.position.x,cam.position.z)+3,2);if(cam.position.y<fl)cam.position.y=fl;
  tmp.copy(P.pos).addScaledVector(fwd,28);tmp.y+=2;cam.up.set(0,1,0);cam.lookAt(tmp);cam.rotateZ(P.roll*.28);
  const fov=62+P.boost*13;if(Math.abs(cam.fov-fov)>.05){cam.fov=lerp(cam.fov,fov,Math.min(1,dt*4));cam.updateProjectionMatrix();}
}
function updateMenuCam(dt){
  P.pos.y=HOME.y+gearH();
  const a=time*.22,d=planeObj.userData.len*1.55+6,narrow=innerWidth<=760;
  cam.position.set(P.pos.x+Math.cos(a)*d,P.pos.y+d*.22,P.pos.z+Math.sin(a)*d);cam.position.y=Math.max(cam.position.y,terrainH(cam.position.x,cam.position.z)+2.5);cam.up.set(0,1,0);cam.lookAt(P.pos);
  if(cam.fov!==50){cam.fov=50;cam.updateProjectionMatrix();}
  // desplaza la vista para que el avión no quede tapado por el panel
  if(narrow)cam.setViewOffset(innerWidth,innerHeight,0,innerHeight*.3,innerWidth,innerHeight);else cam.setViewOffset(innerWidth,innerHeight,-Math.min(450,innerWidth)/2,0,innerWidth,innerHeight);
}

/* ================= HUD ================= */
const mapC=$('map'),mx=mapC.getContext('2d'),ptr=$('ptr'),v3=new T.Vector3();
let hudT=0;
function drawHud(dt){
  const cur=currentTarget();
  if(cur){v3.copy(cur.p).project(cam);const behind=v3.z>1;let x=v3.x,y=v3.y;if(behind){x=-x;y=-y;}
    const off=behind||Math.abs(x)>.9||Math.abs(y)>.82;
    if(off){const m=Math.max(Math.abs(x)/.88,Math.abs(y)/.78,.0001);x/=m;y/=m;}
    ptr.hidden=false;ptr.className=off?'off':'';ptr.style.transform='translate('+((x*.5+.5)*innerWidth).toFixed(1)+'px,'+((-y*.5+.5)*innerHeight).toFixed(1)+'px)';
    ptr.firstElementChild.style.transform=off?'rotate('+Math.atan2(x,y).toFixed(3)+'rad)':'';
    ptr.lastElementChild.textContent=Math.round(cur.p.distanceTo(P.pos))+' m';
  }else ptr.hidden=true;
  hudT-=dt;if(hudT>0)return;hudT=.1;
  $('gSpd').textContent=Math.round(P.speed*3.6);$('gAlt').textContent=P.ground?'PISTA':Math.max(0,Math.round(P.pos.y));$('hMoney').textContent=fmt(save.money);
  if(mission){const s=Math.max(0,Math.ceil(mission.tLeft)),e=$('hTime');e.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');e.className='h num'+(s<=10?' low':'');}
  // minimapa (arriba = hacia donde vuelas)
  const W=248,c=W/2,sc=c/4200,cy=Math.cos(P.yaw),sy=Math.sin(P.yaw);
  const tx=(x,z)=>{const dx=x-P.pos.x,dz=z-P.pos.z;return[c+(dx*cy-dz*sy)*sc,c+(dx*sy+dz*cy)*sc];};
  mx.clearRect(0,0,W,W);mx.save();mx.beginPath();mx.arc(c,c,c,0,6.3);mx.clip();
  for(const I of ISL){const q=tx(I.x,I.z);mx.fillStyle=I.t==='v'?'#8a5a48':I.t==='a'?'#d9cf9a':'#5fae55';mx.beginPath();mx.arc(q[0],q[1],I.r*.82*sc,0,6.3);mx.fill();}
  mx.strokeStyle='#ffffff';mx.lineWidth=4;for(const I of ISL){const s=I.strip,q=tx(s.x,s.z),ex=(s.ux*cy-s.uz*sy)*7,ey=(s.ux*sy+s.uz*cy)*7;mx.beginPath();mx.moveTo(q[0]-ex,q[1]-ey);mx.lineTo(q[0]+ex,q[1]+ey);mx.stroke();}
  if(cur===navT){let q=tx(cur.p.x,cur.p.z);const dx=q[0]-c,dy=q[1]-c,l=Math.hypot(dx,dy);if(l>c-10)q=[c+dx/l*(c-10),c+dy/l*(c-10)];mx.strokeStyle='#ffc83d';mx.lineWidth=4;mx.beginPath();mx.arc(q[0],q[1],13,0,6.3);mx.stroke();}
  mx.fillStyle='#ffc83d';for(const k of coins)if(k.cd<=0){const q=tx(k.m.position.x,k.m.position.z);mx.fillRect(q[0]-2,q[1]-2,4,4);}
  if(mission)for(const t of mission.targets)if(!t.done){let q=tx(t.p.x,t.p.z);const dx=q[0]-c,dy=q[1]-c,l=Math.hypot(dx,dy);if(l>c-8){q=[c+dx/l*(c-8),c+dy/l*(c-8)];}
    mx.fillStyle=t===cur?'#ffffff':t.kind==='water'?'#5fe8ff':t.kind==='fire'?'#ff5a1f':'#ff8a2b';mx.beginPath();mx.arc(q[0],q[1],t===cur?8:5,0,6.3);mx.fill();}
  mx.restore();mx.fillStyle='#fff';mx.beginPath();mx.moveTo(c,c-13);mx.lineTo(c+9,c+10);mx.lineTo(c,c+5);mx.lineTo(c-9,c+10);mx.closePath();mx.fill();
}

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const starsH=n=>'<span class="stars" aria-label="Dificultad '+n+' de 3">'+'★'.repeat(n)+'<i>'+'★'.repeat(3-n)+'</i></span>';
const tfmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');

  $('money').textContent=fmt(save.money);$('tabM').setAttribute('aria-selected',tab==='mis');$('tabH').setAttribute('aria-selected',tab==='han');
  $('oInv').textContent='Vertical: '+(save.inv?'estilo piloto (↑ baja)':'arcade (↑ sube)');$('oSnd').textContent='Sonido: '+(save.snd?'sí':'no');$('oGfx').textContent='Gráficos: '+(save.gfx?'altos':'rápidos');
  let h='';
  if(tab==='mis'){
    if(result){const r=result;
      if(r.ok)h+='<div class="result"><h3>Misión cumplida</h3><dl><dt>'+esc(r.name)+'</dt><dd class="num">'+fmt(r.base)+'</dd><dt>Bono por tiempo</dt><dd class="num">'+fmt(r.time)+'</dd>'+(r.cargo?'<dt>Bodega del Albatros</dt><dd class="num">'+fmt(r.cargo)+'</dd>':'')+'<dt class="tot">Cobrado</dt><dd class="tot num">'+fmt(r.total)+'</dd></dl></div>';
      else h+='<div class="result bad"><h3>'+(r.reason==='crash'?'Te estrellaste':r.reason==='quit'?'Misión abandonada':'Se acabó el tiempo')+'</h3><dl><dt>'+esc(r.name)+'</dt><dd></dd>'+(r.fee?'<dt>Reparación del avión</dt><dd class="num">−'+fmt(r.fee)+'</dd>':'')+'</dl>'+(r.tip?'<p style="margin:6px 0 0">'+esc(r.tip)+'</p>':'')+'</div>';}

    h+='<p style="margin:0;color:var(--dim)">Vuelas el <b style="color:var(--fg)">'+S.name+'</b>. Elige un encargo:</p>';
    offers.forEach((m,i)=>{h+='<article class="card"><div class="card-top"><span class="kind">'+KIND[m.type]+'</span>'+starsH(m.stars)+'</div><h3>'+esc(m.name)+'</h3><p>'+esc(m.desc)+' '+HINT[m.stars-1]+'</p>'+
      '<div class="card-foot"><span class="pay num">'+fmt(m.reward)+'</span><span class="tm num">Tiempo '+tfmt(m.time)+'</span><button class="go" type="button" data-m="'+i+'">Volar</button></div></article>';});
    h+='<article class="card"><div class="card-top"><span class="kind">Sin reloj</span></div><h3>Vuelo libre</h3><p>Explora las ocho islas, atrapa estrellas de $50 y gana $150 la primera vez que aterrizas en cada pista.</p><div class="card-foot"><button class="go alt" type="button" data-m="free">Despegar</button></div></article>';
  }else{
    for(const p of PLANES){const own=save.owned.includes(p.id),sel=save.sel===p.id,can=save.money>=p.price;
      const bar=(l,v)=>'<span>'+l+'</span><div class="bar"><i style="width:'+Math.round(clamp(v,.06,1)*100)+'%"></i></div>';
      h+='<article class="card'+(previewId===p.id?' sel':'')+'" data-p="'+p.id+'"><div class="card-top"><span class="kind">'+p.tag+'</span>'+(sel?'<span class="stars">EN USO</span>':'')+'</div><h3>'+p.name+'</h3>'+
        '<div class="bars">'+bar('Velocidad',p.max/285)+bar('Giro',p.turn/1.5)+bar('Turbo',(p.max-p.cruise)/103)+'</div><p class="perk">'+p.perk+'</p>'+
        '<div class="card-foot">'+(own?'<span class="tm">Ya es tuyo</span>':'<span class="pay num">'+fmt(p.price)+'</span>')+
        (sel?'<button class="go" type="button" disabled>En uso</button>':own?'<button class="go" type="button" data-use="'+p.id+'">Usar</button>':can?'<button class="go" type="button" data-buy="'+p.id+'">Comprar</button>':'<button class="go" type="button" disabled>Te faltan '+fmt(p.price-save.money)+'</button>')+'</div></article>';}
  }
  $('list').innerHTML=h;
}
$('list').addEventListener('click',e=>{
  const b=e.target.closest('button'),card=e.target.closest('[data-p]');
  if(b&&b.dataset.m!==undefined){startFlight(b.dataset.m==='free'?null:offers[+b.dataset.m]);return;}
  if(b&&b.dataset.buy){const p=planeById(b.dataset.buy);if(save.money>=p.price&&!save.owned.includes(p.id)){save.money-=p.price;save.owned.push(p.id);save.sel=p.id;previewId=p.id;setPlane(p.id);persist();audioInit();beep(520,1040,.4,.12);renderMenu();}return;}
  if(b&&b.dataset.use){save.sel=previewId=b.dataset.use;setPlane(save.sel);persist();renderMenu();return;}
  if(card){previewId=card.dataset.p;setPlane(previewId);const y=$('list').scrollTop;renderMenu();$('list').scrollTop=y;}
});
$('tabM').onclick=()=>{tab='mis';previewId=save.sel;setPlane(save.sel);renderMenu();$('list').scrollTop=0;};
$('tabH').onclick=()=>{tab='han';result=null;renderMenu();$('list').scrollTop=0;};
$('oInv').onclick=()=>{save.inv=!save.inv;persist();renderMenu();};
$('oSnd').onclick=()=>{save.snd=!save.snd;persist();renderMenu();};
$('oGfx').onclick=()=>{save.gfx=!save.gfx;persist();applyGfx();renderMenu();};
let resetArm=0;
$('oReset').onclick=function(){if(Date.now()-resetArm<4000){save={money:0,owned:['gorrion'],sel:'gorrion',done:0,visited:[],inv:save.inv,snd:save.snd};persist();previewId='gorrion';setPlane('gorrion');result=null;newOffers();this.textContent='Borrar partida';resetArm=0;renderMenu();}
  else{resetArm=Date.now();this.textContent='¿Seguro? Toca otra vez para borrar';setTimeout(()=>{if(resetArm){this.textContent='Borrar partida';resetArm=0;}},4000);}};
function quit(){if(state!=='fly')return;if(mission){result={ok:false,name:mission.def.name,reason:'quit',fee:0};}else result=null;toMenu();}
$('quit').onclick=quit;

/* ================= Entradas ================= */
addEventListener('keydown',e=>{keys[e.code]=true;if(state==='fly'&&/^(Arrow|Space)/.test(e.code))e.preventDefault();if(e.code==='Escape')quit();});
addEventListener('keyup',e=>{keys[e.code]=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;});
if(matchMedia('(pointer:coarse)').matches||'ontouchstart'in window)document.body.classList.add('touch');
(function touch(){const st=$('stick'),kn=$('knob');let id=null;
  const mv=e=>{const r=st.getBoundingClientRect();let x=(e.clientX-r.left-r.width/2)/(r.width/2),y=(e.clientY-r.top-r.height/2)/(r.height/2);const l=Math.hypot(x,y);if(l>1){x/=l;y/=l;}stick.x=x;stick.y=y;kn.style.transform='translate('+x*39+'px,'+y*39+'px)';};
  const up=e=>{if(e.pointerId!==id)return;id=null;stick.x=stick.y=0;kn.style.transform='';};
  st.addEventListener('pointerdown',e=>{id=e.pointerId;st.setPointerCapture(id);mv(e);e.preventDefault();});
  st.addEventListener('pointermove',e=>{if(e.pointerId===id)mv(e);});st.addEventListener('pointerup',up);st.addEventListener('pointercancel',up);
  for(const[el,k]of[[$('bBoost'),'boost'],[$('bBrake'),'brake']]){el.addEventListener('pointerdown',e=>{tb[k]=true;e.preventDefault();});for(const ev of['pointerup','pointercancel','pointerleave'])el.addEventListener(ev,()=>{tb[k]=false;});}
  document.addEventListener('contextmenu',e=>{if(state==='fly')e.preventDefault();});
})();

/* ================= Bucle ================= */
function resize(){renderer.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.clearViewOffset();cam.updateProjectionMatrix();}
addEventListener('resize',resize);
let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,(now-last)/1000);last=now;time+=dt;
  if(state==='menu'){updateMenuCam(dt);}
  else{
    if(cam.view&&cam.view.enabled)cam.clearViewOffset();
    if(state==='fly'){updateFlight(dt,true);if(state!=='crash')updateCam(dt);}
    else if(state==='win'){updateFlight(dt,false);if(state==='win')updateCam(dt);endT-=dt;if(endT<=0&&state==='win')toMenu();}
    if(state==='crash'){endT-=dt;if(endT<=0){if(!mission&&result&&result.name==='Vuelo libre'){result=null;planeObj.visible=true;startFlight(null);}else toMenu();}}
    if(state!=='menu'){drawHud(dt);engSet(state!=='crash',P.speed,planeSpec.b.eng==='jet');}
    if(msgT>0){msgT-=dt;if(msgT<=0)$('hMsg').style.opacity=0;}
  }
  // avión
  planeObj.position.copy(P.pos);planeObj.rotation.set(P.pitch,P.yaw,P.roll*1.15,'YXZ');
  for(const s of planeObj.userData.spin)s.rotation.z+=dt*(state==='menu'?7:38);
  if(planeObj.userData.gear)planeObj.userData.gear.visible=planeObj.userData.fixed||P.ground||(P.pos.y<110&&nearestStrip(P.pos.x,P.pos.z).d2<640000);
  for(const g of planeObj.userData.glow)g.scale.set(1,1,.45+P.boost*1.3+Math.random()*.15);
  // objetivos
  if(mission){const cur=currentTarget();smokeT-=dt;const sm=smokeT<=0;if(sm)smokeT=.12;
    for(const t of mission.targets){if(!t.mesh)continue;const act=!mission.def.ordered||t===cur;
      for(const m of t.mats)m.opacity=m.userData.base*(act?(t===cur?.75+.25*Math.sin(time*6):1):.28);
      if(t.spin)t.spin.rotation.y+=dt*2;if(t.kind==='balloon')t.mesh.position.y=t.p.y+Math.sin(time*1.5+t.p.x)*2;
      if(t.kind==='ring'&&t===cur)t.mesh.scale.setScalar(1+.04*Math.sin(time*6));
      if(t.kind==='fire'&&sm){spawnP(t.p.x+rnd(-6,6),t.p.y+6,t.p.z+rnd(-6,6),rnd(-3,3),rnd(18,30),rnd(-3,3),Math.random()<.35?0xff7a1a:0x3a3a3a,5,2.2,13,false);}}}
  for(const c of coins){if(c.cd>0){c.cd-=dt;if(c.cd<=0)c.m.visible=true;}else c.m.rotation.y+=dt*2.2;}
  for(const p of parts){if(p.life<=0)continue;p.life-=dt;if(p.life<=0){p.m.visible=false;continue;}const k=p.life/p.max;p.m.position.x+=p.vx*dt;p.m.position.y+=p.vy*dt;p.m.position.z+=p.vz*dt;p.m.scale.setScalar(p.size+p.grow*(1-k));p.m.material.opacity=k*.85;}
  if(planeObj.userData.strobe)planeObj.userData.strobe.visible=time%1.3<.08;
  sunL.target.position.copy(P.pos);sunL.position.copy(P.pos).addScaledVector(SUN,620);
  {const k=P.pos.y/SUN.y,sx=P.pos.x-SUN.x*k,sz=P.pos.z-SUN.z*k,L=planeSpec.b;seaShadow.visible=planeObj.visible&&P.pos.y<420&&terrainH(sx,sz)<0;
    if(seaShadow.visible){seaShadow.position.x=sx;seaShadow.position.z=sz;seaShadow.rotation.y=P.yaw;seaShadow.scale.set(L.span*.42,1,L.len*.42);seaShadow.material.opacity=.32*(1-P.pos.y/420);}}
  sky.position.copy(cam.position);water.position.set(cam.position.x,0,cam.position.z);
  water.material.uniforms.t.value=time;water.material.uniforms.camPos.value.copy(cam.position);
  renderer.render(scene,cam);
}
applyGfx();setPlane(save.sel);park(HOME,1);newOffers();resize();renderMenu();requestAnimationFrame(frame);
window.__alas={P,get state(){return state;},get mission(){return mission;},save,start:startFlight,offers:()=>offers,terrainH,ISL,keys};
})();
</script>

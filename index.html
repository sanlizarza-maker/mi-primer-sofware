<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="calculadora">
        <div class="barra-superior">
            <span class="titulo">Calculadora</span>
            <button class="boton-tema" id="boton-tema" aria-label="Cambiar tema">🌙</button>
        </div>

        <div class="pantalla">
            <div class="historial" id="historial"></div>
            <div class="resultado" id="resultado">0</div>
        </div>

        <div class="botones">
            <button class="tecla funcion" data-accion="limpiar">C</button>
            <button class="tecla funcion" data-accion="borrar">⌫</button>
            <button class="tecla funcion" data-accion="porcentaje">%</button>
            <button class="tecla operador" data-valor="/">÷</button>

            <button class="tecla numero" data-valor="7">7</button>
            <button class="tecla numero" data-valor="8">8</button>
            <button class="tecla numero" data-valor="9">9</button>
            <button class="tecla operador" data-valor="*">×</button>

            <button class="tecla numero" data-valor="4">4</button>
            <button class="tecla numero" data-valor="5">5</button>
            <button class="tecla numero" data-valor="6">6</button>
            <button class="tecla operador" data-valor="-">−</button>

            <button class="tecla numero" data-valor="1">1</button>
            <button class="tecla numero" data-valor="2">2</button>
            <button class="tecla numero" data-valor="3">3</button>
            <button class="tecla operador" data-valor="+">+</button>

            <button class="tecla numero cero" data-valor="0">0</button>
            <button class="tecla numero" data-valor=".">.</button>
            <button class="tecla igual" data-accion="igual">=</button>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
